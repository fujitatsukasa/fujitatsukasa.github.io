name: Blue Archive direct visual samples v61

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/collect_direct_visual_samples.py
      - .github/workflows/bluearchive-direct-visual-samples-v61.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
      - name: Directly play and sample all competitor videos
        run: python research/bluearchive_v61/collect_direct_visual_samples.py
      - name: Upload direct visual samples
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-direct-visual-samples-v61
          path: artifact_direct_visual_samples_v61
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
