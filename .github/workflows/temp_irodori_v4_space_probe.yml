name: Temporary local CPU Irodori v3 VoiceDesign test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  local-cpu-test:
    if: startsWith(github.head_ref, 'tmp/irodori-v4-asmr-emotion-')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and system audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 git
          python -m pip install --upgrade pip uv pyarrow soundfile huggingface_hub hf_xet

      - name: Install official Irodori runtime for CPU
        run: |
          git clone --depth 1 https://github.com/Aratako/Irodori-TTS.git Irodori-TTS
          cd Irodori-TTS
          uv sync --extra cpu

      - name: Generate one local CPU v3 VoiceDesign sample
        run: |
          cd Irodori-TTS
          uv run --no-sync python ../tools/test_local_irodori_v3_cpu.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-irodori-v3-cpu-test
          path: Irodori-TTS/local_v3_test_output/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
