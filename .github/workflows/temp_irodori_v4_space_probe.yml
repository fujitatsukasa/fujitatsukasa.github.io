name: Temporary Irodori v4 Space API probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'tmp/irodori-v4-asmr-emotion-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade gradio_client huggingface_hub
      - run: python tools/probe_irodori_v4_space.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irodori-v4-space-api-probe
          path: probe_output/
          if-no-files-found: error
          retention-days: 1
