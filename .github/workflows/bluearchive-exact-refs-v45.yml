name: Blue Archive exact references v45

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v45/download_exact_references.py
      - .github/workflows/bluearchive-exact-refs-v45.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and current roster
        run: |
          python -m pip install --quiet pillow requests
          git clone --depth=1 https://github.com/QuetzalSidera/StuArchive.git StuArchive
      - name: Download exact ID-matched references
        run: python research/bluearchive_v45/download_exact_references.py StuArchive '${{ matrix.shard }}' 8
      - name: Upload exact reference shard
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-exact-refs-v45-${{ matrix.shard }}
          path: artifact_bluearchive_exact_refs_v45_*
          if-no-files-found: error
          compression-level: 6
          retention-days: 2