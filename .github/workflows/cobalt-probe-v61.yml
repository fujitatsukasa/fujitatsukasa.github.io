name: Cobalt media probe v61
on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/cobalt_probe.py
      - .github/workflows/cobalt-probe-v61.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python research/bluearchive_v61/cobalt_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: cobalt-probe-v61
          path: artifact_cobalt_probe_v61
          if-no-files-found: error
          retention-days: 2
