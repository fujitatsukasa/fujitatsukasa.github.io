name: Transcript site endpoint probe v61
on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/transcript_site_probe.py
      - .github/workflows/transcript-site-probe-v61.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python research/bluearchive_v61/transcript_site_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: transcript-site-probe-v61
          path: artifact_transcript_site_probe
          if-no-files-found: error
          retention-days: 2
