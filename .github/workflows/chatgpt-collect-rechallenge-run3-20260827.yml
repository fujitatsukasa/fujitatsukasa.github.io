name: ChatGPT collect Rechallenge Tokyo run3 20260827

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-collect-rechallenge-run3-20260827.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils fonts-noto-cjk
          python -m pip install requests beautifulsoup4 lxml pillow imagehash yt-dlp playwright
          python -m playwright install --with-deps chromium

      - name: Fetch collector from source repository
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/fujitatsukasa/image_choice/1683f7491144b3473f0551b32d9cf24d83e938cb/scripts/collect_rechallenge_media.py' -o /tmp/rechallenge_collector.py
          python -m py_compile /tmp/rechallenge_collector.py
          wc -c /tmp/rechallenge_collector.py

      - name: Collect public real media
        run: python /tmp/rechallenge_collector.py

      - name: Upload collected media
        uses: actions/upload-artifact@v4
        with:
          name: rechallenge-raw-run3-20260827
          path: rechallenge_output/
          if-no-files-found: error
          compression-level: 5
          retention-days: 1
