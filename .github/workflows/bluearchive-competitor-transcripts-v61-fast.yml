name: Blue Archive competitor transcripts v61 fast
on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/collect_competitor_transcripts_fast.py
      - .github/workflows/bluearchive-competitor-transcripts-v61-fast.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python research/bluearchive_v61/collect_competitor_transcripts_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: bluearchive-competitor-transcripts-v61-fast
          path: artifact_competitor_transcripts_v61_fast
          if-no-files-found: error
          compression-level: 9
          retention-days: 2
