name: Blue Archive visual reference library v50

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v50/collect_reference_library.py
      - .github/workflows/bluearchive-reference-library-v50.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and current public data mirror
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet requests pillow
          git clone --depth=1 https://github.com/QuetzalSidera/StuArchive.git StuArchive
      - name: Collect official, fan parody, and general reference images
        shell: bash
        run: |
          set -euxo pipefail
          python research/bluearchive_v50/collect_reference_library.py StuArchive artifact_bluearchive_reference_v50
      - name: Upload reference library
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-reference-library-v50
          path: artifact_bluearchive_reference_v50
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
