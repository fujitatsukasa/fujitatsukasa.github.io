name: Blue Archive four base stills v54

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v54/generate_four_base_stills.py
      - .github/workflows/bluearchive-four-base-stills-v54.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: python research/bluearchive_v54/generate_four_base_stills.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-four-base-stills-v54
          path: artifact_bluearchive_four_base_stills_v54
          if-no-files-found: error
          compression-level: 9
          retention-days: 2
