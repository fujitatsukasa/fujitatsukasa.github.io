name: Temporary Irodori final high 4 public

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  generate-high-voices:
    if: startsWith(github.head_ref, 'tmp/irodori-final-high4-public-')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        voice: [4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '600'
      TOKENIZERS_PARALLELISM: 'false'
      VOICE_INDEX: ${{ matrix.voice }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch exact final generator and install current Irodori CPU runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 git
          python -m pip install --upgrade pip uv
          git clone --depth 1 --branch tmp/irodori-final-delivery-20260805 https://github.com/fujitatsukasa/fujitatsukasa.github.io.git voicegen
          cd voicegen
          git clone --depth 1 https://github.com/Aratako/Irodori-TTS.git Irodori-TTS
          cd Irodori-TTS
          uv sync --extra cpu
          uv pip install faster-whisper rapidfuzz pykakasi scipy soundfile

      - name: Generate one clean high voice with ten matched acting styles
        run: |
          cd voicegen/Irodori-TTS
          uv run --no-sync python ../tools/generate_irodori_final_delivery.py

      - name: Upload voice WAVs and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irodori-final-high-public-voice-${{ matrix.voice }}
          path: voicegen/delivery_output/voice_${{ matrix.voice }}/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
