name: Blue Archive competitor transcripts and storyboards v61

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/fetch_competitor_transcripts_storyboards.py
      - .github/workflows/bluearchive-competitor-transcripts-storyboards-v61.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow
      - name: Fetch transcripts and YouTube storyboard sprites
        run: python research/bluearchive_v61/fetch_competitor_transcripts_storyboards.py
      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-competitor-transcripts-storyboards-v61
          path: artifact_bluearchive_competitor_transcripts_storyboards_v61
          if-no-files-found: error
          compression-level: 9
          retention-days: 2
