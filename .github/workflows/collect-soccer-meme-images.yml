name: Temporary Fukuoka Assembly Media Supplement

on:
  pull_request:
    branches: [main]
    paths:
      - '.chatgpt_fukuoka_media_trigger'

permissions:
  contents: read

jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow yt-dlp
      - name: Collect newly discovered galleries and direct streams
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations
          import csv, hashlib, html, json, re, shutil, subprocess, sys, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, unquote
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          ROOT=Path('supplement'); ASSETS=ROOT/'assets'; META=ROOT/'meta'; TMP=ROOT/'tmp'
          for d in (ASSETS,META,TMP): d.mkdir(parents=True,exist_ok=True)
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'ja,en-US;q=0.8,en;q=0.6'}
          session=requests.Session(); session.headers.update(H)
          rows=[]; pages=[]; media=[]; seen={}
          page_seeds=[
            'https://www.fnn.jp/articles/-/1102437?display=full',
            'https://news.tnc.co.jp/news/articles/NID2026082631811',
            'https://mainichi.jp/articles/20260827/ddl/k40/010/070000c',
            'https://newsdig.tbs.co.jp/articles/rkb/2830179',
            'https://newsdig.tbs.co.jp/articles/-/2830179?page=4',
            'https://kbc.co.jp/gyutto/detail.php?cdid=47081',
            'https://news.tnc.co.jp/news/articles/NID2026080531549',
            'https://www.fnn.jp/articles/-/1096862',
            'https://news.tv-asahi.co.jp/news_society/articles/900197296.html',
            'https://news.tv-asahi.co.jp/news_society/articles/900195977.html',
            'https://www.gikai.pref.fukuoka.lg.jp/site/honkaigi/saiketsu-0808.html',
            'https://www.gikai.pref.fukuoka.lg.jp/site/honkaigi/gian-0808.html',
            'https://www.gikai.pref.fukuoka.lg.jp/site/topics/gaiyou-021215.html',
            'https://www.gikai.pref.fukuoka.lg.jp/topics/topics-list-r02.html',
            'https://www.gikai.pref.fukuoka.lg.jp/topics/topics-list-r03.html',
            'https://nakamurakatsuki.jp/2026/07/30/post-1722/'
          ]
          direct=[
            'https://news.tnc.co.jp/data/local/NID202606113076701.jpg',
            'https://cdp-japan.jp/files/v3Tt/AK5G/WnyI/SvJ5/v3TtAK5GWnyISvJ55JtgURcM_tn960.jpg',
            'https://image.news.livedoor.com/newsimage/stf/1/2/12f4c_1110_1f5297ac87fb774908dfd915b88d6165.jpeg',
            'https://news.tnc.co.jp/data/local/NID202608253179301.jpg'
          ]

          def sha(b): return hashlib.sha256(b).hexdigest()
          def slug(s,n=70):
              s=unquote(s); s=re.sub(r'[^0-9A-Za-z._-]+','_',s).strip('._')
              return (s or 'asset')[:n]
          def get(u,t=35): return session.get(u,timeout=t,allow_redirects=True)
          def save_image(data,u,source,prefix,force=False):
              h=sha(data)
              if h in seen:
                  rows.append({'source_page':source,'asset_url':u,'status':'SHA_DUPLICATE','file':seen[h],'sha256':h,'width':'','height':'','bytes':len(data),'note':''}); return None
              p=TMP/(prefix+'_'+h[:12]+'.bin'); p.write_bytes(data)
              try:
                  with Image.open(p) as im: im.load(); w,hh=im.size; fmt=(im.format or 'JPEG').upper()
                  ext={'JPEG':'.jpg','PNG':'.png','WEBP':'.webp','TIFF':'.tif','BMP':'.bmp'}.get(fmt,'.jpg')
                  if not force and (w<500 or hh<280):
                      p.unlink(missing_ok=True); rows.append({'source_page':source,'asset_url':u,'status':'EXCLUDED_LOW_RES','file':'','sha256':h,'width':w,'height':hh,'bytes':len(data),'note':fmt}); return None
                  dest=ASSETS/(prefix+'_'+h[:12]+ext); p.replace(dest); seen[h]=str(dest)
                  rows.append({'source_page':source,'asset_url':u,'status':'SAVED','file':str(dest),'sha256':h,'width':w,'height':hh,'bytes':len(data),'note':fmt}); return str(dest)
              except Exception as e:
                  p.unlink(missing_ok=True); rows.append({'source_page':source,'asset_url':u,'status':'EXCLUDED_NOT_IMAGE','file':'','sha256':h,'width':'','height':'','bytes':len(data),'note':repr(e)[:160]}); return None
          def dl_image(u,source,prefix,force=False):
              try:
                  r=get(u)
                  if r.status_code!=200: rows.append({'source_page':source,'asset_url':u,'status':f'HTTP_{r.status_code}','file':'','sha256':'','width':'','height':'','bytes':len(r.content),'note':''}); return
                  if 'text/html' in r.headers.get('content-type','').lower(): rows.append({'source_page':source,'asset_url':u,'status':'EXCLUDED_HTML','file':'','sha256':'','width':'','height':'','bytes':len(r.content),'note':''}); return
                  save_image(r.content,r.url,source,prefix,force)
              except Exception as e: rows.append({'source_page':source,'asset_url':u,'status':'ERROR','file':'','sha256':'','width':'','height':'','bytes':'','note':repr(e)[:200]})
          def add_json(obj,imgs,streams):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      if isinstance(v,str):
                          s=html.unescape(v).replace('\\/','/')
                          if re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',s,re.I): imgs.add(s)
                          if re.search(r'\.(?:m3u8|mp4)(?:\?|$)',s,re.I): streams.add(s)
                      elif isinstance(v,(dict,list)): add_json(v,imgs,streams)
              elif isinstance(obj,list):
                  for x in obj: add_json(x,imgs,streams)
          def crawl(idx,u):
              started=time.time(); imgs=set(); streams=set()
              try:
                  r=get(u); status=f'HTTP_{r.status_code}'
                  if r.status_code!=200: pages.append({'page_url':u,'status':status,'found_images':0,'found_streams':0,'saved':0,'sha_duplicate':0,'excluded':0,'seconds':round(time.time()-started,2)}); return
                  text=r.text; soup=BeautifulSoup(text,'lxml')
                  for tag in soup.find_all(['meta','img','source','a','video']):
                      for key in ('content','src','href','data-src','data-original','data-lazy-src','poster'):
                          v=tag.get(key)
                          if not v: continue
                          v=html.unescape(v).replace('\\/','/')
                          if re.search(r'\.(?:jpe?g|png|webp)(?:[?#].*)?$',v,re.I): imgs.add(urljoin(r.url,v))
                          if re.search(r'\.(?:m3u8|mp4)(?:[?#].*)?$',v,re.I): streams.add(urljoin(r.url,v))
                      for key in ('srcset','data-srcset'):
                          v=tag.get(key)
                          if v:
                              for part in v.split(','):
                                  x=part.strip().split()[0]
                                  if re.search(r'\.(?:jpe?g|png|webp)(?:[?#].*)?$',x,re.I): imgs.add(urljoin(r.url,x))
                  for sc in soup.find_all('script'):
                      tx=sc.string or sc.get_text(' ',strip=True)
                      if not tx: continue
                      try: add_json(json.loads(tx),imgs,streams)
                      except Exception: pass
                  raw=html.unescape(text).replace('\\/','/')
                  for x in re.findall(r'https?://[^"\'<>\s]+?\.(?:jpe?g|png|webp)(?:\?[^"\'<>\s]*)?',raw,re.I): imgs.add(x)
                  for x in re.findall(r'https?://[^"\'<>\s]+?\.(?:m3u8|mp4)(?:\?[^"\'<>\s]*)?',raw,re.I): streams.add(x)
                  before=len(rows)
                  for n,x in enumerate(sorted(imgs),1): dl_image(x,r.url,f's{idx:02d}_{n:03d}')
                  new=rows[before:]; saved=sum(x['status']=='SAVED' for x in new); dup=sum(x['status']=='SHA_DUPLICATE' for x in new); exc=len(new)-saved-dup
                  pages.append({'page_url':u,'final_url':r.url,'status':status,'found_images':len(imgs),'found_streams':len(streams),'saved':saved,'sha_duplicate':dup,'excluded':exc,'seconds':round(time.time()-started,2)})
                  media.append({'source_page':r.url,'streams':sorted(streams)})
              except Exception as e: pages.append({'page_url':u,'status':'ERROR','found_images':0,'found_streams':0,'saved':0,'sha_duplicate':0,'excluded':0,'seconds':round(time.time()-started,2),'note':repr(e)[:240]})

          for i,u in enumerate(direct,1): dl_image(u,u,f'direct_s{i:02d}',True)
          for i,u in enumerate(page_seeds,1): crawl(i,u)

          video_rows=[]
          candidates=[]
          for m in media:
              for s in m['streams']:
                  if s not in [x[1] for x in candidates]: candidates.append((m['source_page'],s))
          for i,(source,s) in enumerate(candidates[:20],1):
              out=TMP/f'video_{i:02d}.mp4'
              try:
                  cmd=[sys.executable,'-m','yt_dlp','--no-playlist','--retries','3','--fragment-retries','3','-f','best[height<=720]/best','--merge-output-format','mp4','--max-filesize','180M','-o',str(out),s]
                  cp=subprocess.run(cmd,text=True,capture_output=True,timeout=600)
                  if not out.exists():
                      found=list(TMP.glob(f'video_{i:02d}.*'))
                      found=[p for p in found if p.suffix.lower() in {'.mp4','.mkv','.webm','.mov','.m4v'}]
                      if found: out=found[0]
                  if out.exists() and out.stat().st_size>100000:
                      data=out.read_bytes(); h=sha(data)
                      if h not in seen:
                          dest=ASSETS/f'実動画_{i:02d}_{h[:12]}{out.suffix.lower()}'; shutil.copy2(out,dest); seen[h]=str(dest)
                          pr=subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height:format=duration','-of','json',str(dest)],text=True,capture_output=True,timeout=60)
                          obj=json.loads(pr.stdout or '{}'); st=(obj.get('streams') or [{}])[0]
                          rows.append({'source_page':source,'asset_url':s,'status':'SAVED_VIDEO','file':str(dest),'sha256':h,'width':st.get('width',''),'height':st.get('height',''),'bytes':len(data),'note':(obj.get('format') or {}).get('duration','')})
                          video_rows.append({'source_page':source,'stream':s,'status':'SAVED','file':str(dest)})
                      else: video_rows.append({'source_page':source,'stream':s,'status':'SHA_DUPLICATE','file':seen[h]})
                  else: video_rows.append({'source_page':source,'stream':s,'status':'FAILED','stderr':cp.stderr[-600:]})
              except Exception as e: video_rows.append({'source_page':source,'stream':s,'status':'ERROR','note':repr(e)[:300]})
              for p in TMP.glob(f'video_{i:02d}.*'): p.unlink(missing_ok=True)

          def writecsv(p,data):
              keys=[]
              for r in data:
                  for k in r:
                      if k not in keys: keys.append(k)
              with p.open('w',encoding='utf-8-sig',newline='') as f:
                  if keys:
                      w=csv.DictWriter(f,fieldnames=keys); w.writeheader(); w.writerows(data)
          inv=[]
          for p in sorted(ASSETS.iterdir()):
              b=p.read_bytes(); h=sha(b); kind='video' if p.suffix.lower() in {'.mp4','.mkv','.webm','.mov','.m4v'} else 'image'; w=hh=''
              if kind=='image':
                  try:
                      with Image.open(p) as im: w,hh=im.size
                  except Exception: pass
              inv.append({'file':str(p),'sha256':h,'bytes':len(b),'width':w,'height':hh,'kind':kind})
          writecsv(META/'asset_discovery.csv',rows); writecsv(META/'page_reconciliation.csv',pages); writecsv(META/'inventory.csv',inv)
          (META/'media_candidates.json').write_text(json.dumps(media,ensure_ascii=False,indent=2),encoding='utf-8')
          (META/'video_status.json').write_text(json.dumps(video_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          summary={'pages':len(page_seeds),'direct':len(direct),'discovered_streams':len(candidates),'unique_files':len(inv),'images':sum(x['kind']=='image' for x in inv),'videos':sum(x['kind']=='video' for x in inv),'generated_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          (META/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'); print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload supplement
        uses: actions/upload-artifact@v4
        with:
          name: fukuoka-assembly-media-supplement
          path: supplement/
          if-no-files-found: error
          compression-level: 3
          retention-days: 1
