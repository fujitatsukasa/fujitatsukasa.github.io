name: Collect Actual Soccer Meme Images

on:
  pull_request:
    branches: [main]
    paths:
      - '.soccer_collector_trigger/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-soccer-meme-images.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum meme rows, 0 means all'
        required: false
        default: '0'
      images_per_meme:
        description: 'Target actual images per meme'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and inspect bundled collector inputs
        shell: bash
        run: |
          mkdir -p .collector_tmp artifact work
          cat meme_research/soccer_collector/script_00.b64 meme_research/soccer_collector/script_01.b64 | base64 -d | gzip -d > .collector_tmp/collector.py
          cat meme_research/soccer_collector/sources_00.b64 meme_research/soccer_collector/sources_01.b64 | base64 -d | gzip -d > .collector_tmp/sources.csv
          sha256sum .collector_tmp/collector.py .collector_tmp/sources.csv | tee artifact/入力SHA256.txt
          echo '5f7fec938cbc0178b8ccf7e7eb8ad11d67ee8563414dcc03ac66271b451477fb  .collector_tmp/sources.csv' | sha256sum -c -
          python -m py_compile .collector_tmp/collector.py
          python - <<'PY'
          import csv
          with open('.collector_tmp/sources.csv', encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==253, len(rows)
          assert '起源・背景' in rows[0] and '自然な使い方' in rows[0]
          print('source_rows',len(rows))
          PY
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow lxml ddgs
      - name: Collect actual web images
        shell: bash
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit || '20' }}
          IMAGES_PER_MEME: ${{ github.event.inputs.images_per_meme || '1' }}
        run: |
          set -o pipefail
          LIMIT_ARGS=()
          if [ "$INPUT_LIMIT" != "0" ]; then LIMIT_ARGS=(--limit "$INPUT_LIMIT"); fi
          python .collector_tmp/collector.py --input .collector_tmp/sources.csv --output 'work/サッカーミーム_実物画像素材' --images-per-meme "$IMAGES_PER_MEME" --workers 4 "${LIMIT_ARGS[@]}" 2>&1 | tee artifact/収集ログ.txt
      - name: Package result
        shell: bash
        run: |
          cd work
          zip -r -9 '../artifact/サッカーミーム_実物画像素材.zip' 'サッカーミーム_実物画像素材'
          cd ..
          cp 'work/サッカーミーム_実物画像素材/収集サマリー.json' artifact/
          cp 'work/サッカーミーム_実物画像素材/未取得一覧.csv' artifact/
          cp 'work/サッカーミーム_実物画像素材/実物画像収集台帳.csv' artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-meme-images-${{ github.run_id }}
          path: artifact/
          retention-days: 3
          if-no-files-found: error
