name: Temporary Rechallenge Tokyo Actual Media Collection

on:
  pull_request:
    branches: [main]
    paths:
      - '.soccer_collector_trigger/**'
      - '.github/workflows/collect-soccer-meme-images.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install base dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 yt-dlp
      - name: Collect actual web media
        run: python .soccer_collector_trigger/collect.py
      - name: Upload collected media
        uses: actions/upload-artifact@v4
        with:
          name: rechallenge-tokyo-actual-media
          path: |
            .soccer_collector_trigger/parts/research_meme_part_01.zip
            .soccer_collector_trigger/research_output/metadata/**
          retention-days: 3
          if-no-files-found: error
