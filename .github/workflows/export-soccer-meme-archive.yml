name: Export Soccer Meme Actual Archive

on:
  pull_request:
    branches: [main]
    paths:
      - '.collector_trigger/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-soccer-meme-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and metadata
        shell: bash
        run: |
          test -f meme_research/research_meme_actual.zip
          test -f meme_research/output/metadata/media_manifest.csv
          test -f meme_research/output/metadata/summary.json
          unzip -t meme_research/research_meme_actual.zip
          mkdir -p artifact
          cp meme_research/research_meme_actual.zip artifact/サッカーミーム_実物画像素材.zip
          cp meme_research/output/metadata/media_manifest.csv artifact/実物画像台帳.csv
          cp meme_research/output/metadata/summary.json artifact/収集サマリー.json
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-meme-actual-archive-${{ github.run_id }}
          path: artifact/
          retention-days: 3
          if-no-files-found: error
