name: Blue Archive fanwork reference v50

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v50/collect_fanwork_library_v50.py
      - .github/workflows/bluearchive-fanwork-reference-v50.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow
      - name: Collect public general-rated Blue Archive fanwork references
        run: python research/bluearchive_v50/collect_fanwork_library_v50.py artifact_bluearchive_fanwork_v50
      - name: Upload fanwork reference library
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-fanwork-reference-v50
          path: artifact_bluearchive_fanwork_v50
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
