name: Temporary public Irodori variation artifact transfer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  upload-transfer-files:
    if: startsWith(github.head_ref, 'tmp/irodori-variation-artifact-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Verify staged transfer files
        run: |
          cd public_transfer
          sha256sum -c file_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: irodori-variation-low8-10each
          path: public_transfer/irodori_variation_low8_10each.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: irodori-variation-mid8-10each
          path: public_transfer/irodori_variation_mid8_10each.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: irodori-variation-high8-10each
          path: public_transfer/irodori_variation_high8_10each.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: irodori-variation-validation
          path: |
            public_transfer/validation_catalog.csv
            public_transfer/validation_result.txt
            public_transfer/summary.json
            public_transfer/file_sha256.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
