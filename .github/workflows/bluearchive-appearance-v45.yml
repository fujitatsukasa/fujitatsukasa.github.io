name: Blue Archive appearance metadata v45

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v45/collect_public_visual_tags.py
      - .github/workflows/bluearchive-appearance-v45.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current roster
        run: git clone --depth=1 https://github.com/QuetzalSidera/StuArchive.git StuArchive
      - name: Collect general-rated visual metadata only
        run: python research/bluearchive_v45/collect_public_visual_tags.py StuArchive '${{ matrix.shard }}' 8
      - name: Upload visual metadata shard
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-appearance-v45-${{ matrix.shard }}
          path: artifact_bluearchive_visual_tags_v45_*
          if-no-files-found: error
          compression-level: 9
          retention-days: 2