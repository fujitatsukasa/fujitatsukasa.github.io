name: Temporary Takubo actual-media collection

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-takubo-media-temporary.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow pymupdf yt-dlp

      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -2
          ffprobe -version | head -2

      - name: Decode and run actual-media collector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p takubo_collection
          printf '%s' '' | base64 -d | gzip -d > takubo_collection/collect.py
          python takubo_collection/collect.py

      - name: Upload actual media bundle
        uses: actions/upload-artifact@v4
        with:
          name: takubo-actual-media-bundle
          path: takubo_collection/output/takubo_actual_media_bundle.zip
          compression-level: 0
          retention-days: 3

      - name: Upload collection metadata
        uses: actions/upload-artifact@v4
        with:
          name: takubo-actual-media-metadata
          path: takubo_collection/output/metadata/**
          retention-days: 3
