name: Blue Archive competitor transcripts v61

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/collect_competitor_transcripts.py
      - .github/workflows/bluearchive-competitor-transcripts-v61.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - name: Extract competitor transcripts through public transcript services
        run: python research/bluearchive_v61/collect_competitor_transcripts.py
      - uses: actions/upload-artifact@v4
        with:
          name: bluearchive-competitor-transcripts-v61
          path: artifact_competitor_transcripts_v61
          if-no-files-found: error
          compression-level: 9
          retention-days: 2
