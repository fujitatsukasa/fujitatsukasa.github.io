name: Blue Archive platform probe v36

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/bluearchive_v36/**'
      - '.github/workflows/bluearchive-platform-probe-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet curl_cffi beautifulsoup4
      - run: python research/bluearchive_v36/platform_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: bluearchive-platform-probe-v36
          path: research/bluearchive_v36/probe_out
          retention-days: 1
          compression-level: 9
