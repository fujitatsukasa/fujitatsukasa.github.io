name: Blue Archive v61 SS narration chunks
on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/generate_v61_ss_chunk.py
      - research/bluearchive_v61/v61_ss.b64
      - .github/workflows/bluearchive-v61-ss-chunks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet edge-tts pydub
      - run: python research/bluearchive_v61/generate_v61_ss_chunk.py '${{ matrix.chunk }}'
      - uses: actions/upload-artifact@v4
        with:
          name: v61-ss-chunk-${{ matrix.chunk }}
          path: artifact_v61_ss_chunk_${{ matrix.chunk }}
          if-no-files-found: error
          retention-days: 2
