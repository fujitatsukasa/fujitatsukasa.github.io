name: Expanded actual meme collection and coverage audit

on:
  push:
    branches:
      - chatgpt/meme-coverage-audit-20260804
    paths:
      - 'meme_research/sources.json'
      - 'meme_research/collect_actual.py'
      - '.github/workflows/meme-coverage-audit-expanded.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'meme_research/**'
      - '.github/workflows/meme-coverage-audit-expanded.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/meme-coverage-audit-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pillow

      - name: Collect and audit actual circulating media
        run: python meme_research/collect_actual.py

      - name: Commit research results to audit branch
        run: |
          git config user.name "chatgpt-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meme_research/coverage_output meme_research/coverage_parts
          git commit -m "Expanded actual meme collection and coverage audit results" || exit 0
          git pull --rebase origin chatgpt/meme-coverage-audit-20260804
          git push origin HEAD:chatgpt/meme-coverage-audit-20260804
