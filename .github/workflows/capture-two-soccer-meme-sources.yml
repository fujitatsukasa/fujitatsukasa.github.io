name: Capture Two Soccer Meme Sources

on:
  pull_request:
    branches: [main]
    paths:
      - '.capture_two_trigger/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-two-soccer-meme-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture exact real usage pages
        shell: bash
        run: |
          mkdir -p artifact
          python - <<'PY'
          from pathlib import Path
          import json, re
          from playwright.sync_api import sync_playwright

          out=Path('artifact')
          items=[
            ('JP021_ゴンゴール_実使用記事画面.png','https://www.daily.co.jp/soccer/2012/12/28/0005631209.shtml','ゴンゴール'),
            ('JP027_大宮ラインコントロール_実使用画面.png','https://seinakan-2025.hatenablog.com/entry/2014/09/29/222005','降格ラインコントローラー'),
          ]
          results=[]
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            ctx=browser.new_context(viewport={'width':1440,'height':1000},locale='ja-JP',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36')
            for fn,url,term in items:
              page=ctx.new_page()
              try:
                page.goto(url,wait_until='domcontentloaded',timeout=45000)
                page.wait_for_timeout(1400)
                for label in ['同意する','すべて同意','Accept all','Accept All','I agree','閉じる']:
                  try:
                    b=page.get_by_role('button',name=re.compile(label,re.I)).first
                    if b.count() and b.is_visible(timeout=250): b.click(timeout=500)
                  except Exception: pass
                loc=page.get_by_text(term,exact=False).first
                found=False
                try:
                  if loc.count() and loc.is_visible(timeout=1500):
                    loc.scroll_into_view_if_needed(timeout=2000); page.wait_for_timeout(600); found=True
                except Exception: pass
                # viewport screenshot after scrolling keeps article context and exact term together
                page.screenshot(path=str(out/fn),full_page=False)
                results.append({'file':fn,'url':page.url,'title':page.title(),'term':term,'term_found':found,'status':'CAPTURED'})
              except Exception as e:
                results.append({'file':fn,'url':url,'term':term,'status':'FAILED','error':type(e).__name__+': '+str(e)})
              finally:
                page.close()
            browser.close()
          (out/'収集結果.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-meme-two-sources-${{ github.run_id }}
          path: artifact/
          retention-days: 3
          if-no-files-found: error
