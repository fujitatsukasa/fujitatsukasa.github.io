name: Blue Archive direct competitor corpus v61 Piped

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/collect_competitor_corpus_piped.py
      - .github/workflows/bluearchive-competitor-corpus-v61-piped.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --quiet requests pillow
      - name: Collect full competitor corpus through public Piped APIs
        run: python research/bluearchive_v61/collect_competitor_corpus_piped.py artifact_bluearchive_competitor_v61_piped
      - name: Upload direct competitor corpus
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-direct-competitor-corpus-v61-piped
          path: artifact_bluearchive_competitor_v61_piped
          if-no-files-found: error
          compression-level: 4
          retention-days: 2
