name: Blue Archive URL source provenance v52

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v52/source_bundle_v52.py
      - .github/workflows/bluearchive-source-provenance-v52.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet curl_cffi beautifulsoup4 pillow
      - name: Fetch URL sources and page images
        run: python research/bluearchive_v52/source_bundle_v52.py artifact_bluearchive_sources_v52
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-url-sources-v52
          path: artifact_bluearchive_sources_v52
          if-no-files-found: error
          compression-level: 9
          retention-days: 2
