name: Capture Six Soccer Meme Sources

on:
  pull_request:
    branches: [main]
    paths:
      - '.capture_six_trigger/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-six-soccer-meme-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright requests pillow
          python -m playwright install --with-deps chromium
      - name: Download actual source images and capture exact usage excerpts
        shell: bash
        run: |
          mkdir -p artifact
          cat > /tmp/capture_six.py <<'PY'
          from pathlib import Path
          import json, requests, hashlib, re
          from PIL import Image
          from playwright.sync_api import sync_playwright

          out=Path('artifact')
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Referer':'https://www.google.com/'})
          direct={
            'JP016_リトル本田_会見実写.jpg':'https://afpbb.ismcdn.jp/mwimgs/f/9/810wm/img_f93486a18968ba6127a1ffad4f56e9ea170465.jpg',
            'JP017_なぜ笑うんだい_元場面実写.jpg':'https://times-abema.ismcdn.jp/mwimgs/f/0/724w/img_f0fc82b8a4224a64aaeee399e8ef3304190297.jpg',
            'JP025_オリ10_歴史実写.jpg':'https://www.nikkansports.com/soccer/news/img/202312020000117-w1300_0.jpg',
          }
          result=[]
          for fn,u in direct.items():
            try:
              r=s.get(u,timeout=30); r.raise_for_status(); p=out/fn; p.write_bytes(r.content)
              with Image.open(p) as im: w,h=im.size
              result.append({'file':fn,'url':u,'width':w,'height':h,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'status':'DOWNLOADED'})
            except Exception as e:
              result.append({'file':fn,'url':u,'status':'FAILED','error':type(e).__name__+': '+str(e)})

          captures=[
            {'file':'JP016_リトル本田_発言記事画面.png','url':'https://www.nikkansports.com/soccer/world/news/202006070000008.html','term':'リトルホンダ','scope':'article'},
            {'file':'JP017_なぜ笑うんだい_元場面記事画面.png','url':'https://www.football-zone.net/archives/407131','term':'なぜ笑うんだい','scope':'article'},
            {'file':'JP021_ゴンゴール_実写真記事画面.png','url':'https://soccermagazine.jp/j1/17359810','term':'ゴンゴール','scope':'article'},
            {'file':'JP025_オリ10_定義記事画面.png','url':'https://www.nikkansports.com/soccer/photonews/photonews_nsInc_202312020000117-0.html','term':'オリジナル10','scope':'article'},
            {'file':'JP027_大宮ラインコントロール_実使用抜粋.png','url':'https://tkrs.net/137','term':'大宮ラインコントローラー','scope':'element'},
            {'file':'JP028_繰り返すこのエジリズム_AA実物抜粋.png','url':'https://socceryougo.com/page/e/116.html','term':'くり返す このエジリズム','scope':'element'},
          ]

          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            ctx=browser.new_context(viewport={'width':1440,'height':1100},user_agent=ua,locale='ja-JP',device_scale_factor=1)
            for item in captures:
              page=ctx.new_page()
              try:
                page.goto(item['url'],wait_until='domcontentloaded',timeout=45000)
                page.wait_for_timeout(1800)
                for label in ['同意する','すべて同意','Accept all','Accept All','I agree','閉じる']:
                  try:
                    b=page.get_by_role('button',name=re.compile(label,re.I)).first
                    if b.count() and b.is_visible(timeout=250): b.click(timeout=500)
                  except Exception: pass
                body=page.locator('body')
                exact=body.get_by_text(item['term'],exact=False).first
                found=False
                try:
                  if exact.count():
                    exact.scroll_into_view_if_needed(timeout=2500); page.wait_for_timeout(700); found=True
                except Exception: pass
                target=None
                if found and item['scope']=='element':
                  for sel in ['p','pre','blockquote','li','div','article']:
                    try:
                      loc=page.locator(sel).filter(has_text=item['term']).first
                      if loc.count() and loc.is_visible(timeout=500):
                        target=loc; break
                    except Exception: pass
                if target is not None:
                  box=target.bounding_box()
                  if box:
                    x=max(0,box['x']-80); y=max(0,box['y']-100); w=min(1440-x,box['width']+160); h=min(1100,box['height']+220)
                    page.screenshot(path=str(out/item['file']),clip={'x':x,'y':y,'width':max(400,w),'height':max(300,h)})
                  else:
                    target.screenshot(path=str(out/item['file']))
                else:
                  page.screenshot(path=str(out/item['file']),full_page=False)
                result.append({'file':item['file'],'url':page.url,'title':page.title(),'term':item['term'],'term_found':found,'status':'CAPTURED'})
              except Exception as e:
                result.append({'file':item['file'],'url':item['url'],'term':item['term'],'status':'FAILED','error':type(e).__name__+': '+str(e)})
              finally:
                page.close()
            browser.close()

          (out/'収集結果.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          python /tmp/capture_six.py | tee artifact/収集ログ.txt
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-meme-six-exact-sources-${{ github.run_id }}
          path: artifact/
          retention-days: 3
          if-no-files-found: error
