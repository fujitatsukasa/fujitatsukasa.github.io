name: Capture Six Soccer Meme Sources

on:
  pull_request:
    branches: [main]
    paths:
      - '.capture_six_trigger/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-six-soccer-meme-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright requests pillow
          python -m playwright install --with-deps chromium
      - name: Download actual images and capture source pages
        shell: bash
        run: |
          mkdir -p artifact
          python - <<'PY'
          from pathlib import Path
          import json, requests, hashlib
          from PIL import Image
          from playwright.sync_api import sync_playwright

          out=Path('artifact')
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Referer':'https://www.google.com/'})
          direct={
            'JP016_リトル本田_会見実写.jpg':'https://afpbb.ismcdn.jp/mwimgs/f/9/810wm/img_f93486a18968ba6127a1ffad4f56e9ea170465.jpg',
            'JP017_なぜ笑うんだい_元場面記事画像.jpg':'https://times-abema.ismcdn.jp/mwimgs/f/0/724w/img_f0fc82b8a4224a64aaeee399e8ef3304190297.jpg',
          }
          result=[]
          for fn,u in direct.items():
            try:
              r=s.get(u,timeout=30); r.raise_for_status(); p=out/fn; p.write_bytes(r.content)
              im=Image.open(p); im.verify()
              result.append({'file':fn,'url':u,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'status':'DOWNLOADED'})
            except Exception as e:
              result.append({'file':fn,'url':u,'status':'FAILED','error':type(e).__name__+': '+str(e)})

          pages=[
            ('JP016_リトル本田_発言記事画面.png','https://www.nikkansports.com/soccer/world/news/202006070000008.html','リトルホンダ'),
            ('JP017_なぜ笑うんだい_元場面記事画面.png','https://times.abema.tv/articles/-/10042459','なぜ笑う'),
            ('JP021_ゴンゴール_用語使用記事画面.png','https://www.at-s.com/shizusaka/article/ats/1764560.html','ゴンゴール'),
            ('JP025_オリ10_歴史写真記事画面.png','https://www.nikkansports.com/soccer/photonews/photonews_nsInc_202312020000117-0.html','オリジナル10'),
            ('JP027_大宮ラインコントロール_実使用画面.png','https://tkrs.net/137','ラインコントローラー'),
            ('JP028_繰り返すこのエジリズム_用語解説画面.png','https://socceryougo.com/page/e/116.html','エジリズム'),
          ]
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            ctx=browser.new_context(viewport={'width':1440,'height':1000},user_agent=ua,locale='ja-JP')
            for fn,u,term in pages:
              p=ctx.new_page()
              try:
                p.goto(u,wait_until='domcontentloaded',timeout=40000)
                p.wait_for_timeout(1500)
                for label in ['同意する','すべて同意','Accept all','Accept All','I agree','閉じる']:
                  try:
                    b=p.get_by_role('button',name=label).first
                    if b.is_visible(timeout=300): b.click(timeout=500)
                  except Exception: pass
                found=False
                try:
                  loc=p.get_by_text(term,exact=False).first
                  if loc.count() and loc.is_visible(timeout=1200):
                    loc.scroll_into_view_if_needed(timeout=2000); p.wait_for_timeout(500); found=True
                except Exception: pass
                if not found:
                  for sel in ['h1','article img','main img','img']:
                    try:
                      loc=p.locator(sel).first
                      if loc.count() and loc.is_visible(timeout=800):
                        loc.scroll_into_view_if_needed(timeout=1500); p.wait_for_timeout(400); break
                    except Exception: pass
                p.screenshot(path=str(out/fn),full_page=False)
                result.append({'file':fn,'url':p.url,'page_title':p.title(),'term':term,'status':'CAPTURED'})
              except Exception as e:
                result.append({'file':fn,'url':u,'term':term,'status':'FAILED','error':type(e).__name__+': '+str(e)})
              finally:
                p.close()
            browser.close()
          (out/'収集結果.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: six-soccer-meme-sources-${{ github.run_id }}
          path: artifact/
          retention-days: 3
          if-no-files-found: error
