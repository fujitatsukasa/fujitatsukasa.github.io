name: Temporary actual meme research collection

on:
  push:
    branches:
      - chatgpt/meme-research-output-20260804
    paths:
      - 'meme_research/sources.json'
      - 'meme_research/collect_actual.py'
      - '.github/workflows/meme-research-actual.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'meme_research/**'
      - '.github/workflows/meme-research-actual.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/meme-research-output-20260804
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Collect actual circulating media
        run: python meme_research/collect_actual.py

      - name: Commit temporary research output to branch
        run: |
          git config user.name "chatgpt-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meme_research/research_meme_actual.zip meme_research/output/metadata meme_research/output/README_研究用実物ミーム収集.txt
          git commit -m "Temporary actual meme research output" || exit 0
          git push origin HEAD:chatgpt/meme-research-output-20260804
