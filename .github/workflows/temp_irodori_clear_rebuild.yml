name: Temporary strict clear Irodori recovery voices 2 3 8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  recover-voices:
    if: startsWith(github.head_ref, 'tmp/irodori-clear-rebuild-')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        voice: [1, 2, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DOWNLOAD_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 git
          python -m pip install --upgrade pip uv

      - name: Install official Irodori CPU runtime and strict validation tools
        run: |
          git clone --depth 1 https://github.com/Aratako/Irodori-TTS.git Irodori-TTS
          cd Irodori-TTS
          uv sync --extra cpu
          uv pip install faster-whisper rapidfuzz pykakasi scipy soundfile

      - name: Recover one failed voice with vocabulary-aware ASR and no trailing speech
        env:
          VOICE_INDEX: ${{ matrix.voice }}
        run: |
          cd Irodori-TTS
          uv run --no-sync python ../tools/build_irodori_clear_voice_v6.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-irodori-clear-v6-voice-${{ matrix.voice }}
          path: Irodori-TTS/clear_voice_output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
