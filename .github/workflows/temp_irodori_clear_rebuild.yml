name: Temporary strict clear Irodori voice-2 recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  recover-voice-2:
    if: startsWith(github.head_ref, 'tmp/irodori-clear-rebuild-')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DOWNLOAD_TIMEOUT: '300'
      VOICE_INDEX: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 git
          python -m pip install --upgrade pip uv

      - name: Install official Irodori CPU runtime and strict validation tools
        run: |
          git clone --depth 1 https://github.com/Aratako/Irodori-TTS.git Irodori-TTS
          cd Irodori-TTS
          uv sync --extra cpu
          uv pip install faster-whisper rapidfuzz pykakasi scipy soundfile

      - name: Recover voice 2 with rate-limit retry and strict reading gate
        run: |
          cd Irodori-TTS
          uv run --no-sync python ../tools/build_irodori_clear_voice_v5.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-irodori-clear-v5-voice-1
          path: Irodori-TTS/clear_voice_output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
