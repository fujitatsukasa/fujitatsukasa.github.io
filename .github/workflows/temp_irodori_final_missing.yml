name: Temporary Irodori legacy completion cancellation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: temporary-irodori-legacy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  retire-legacy-run:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Legacy completion cancelled; fresh v4-Small matrix is authoritative.'
