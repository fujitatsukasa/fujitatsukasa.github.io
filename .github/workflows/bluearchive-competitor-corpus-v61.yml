name: Blue Archive direct competitor corpus v61

on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/collect_competitor_corpus.py
      - .github/workflows/bluearchive-competitor-corpus-v61.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install video analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install --quiet yt-dlp pillow
      - name: Download and directly sample competitor videos
        run: python research/bluearchive_v61/collect_competitor_corpus.py artifact_bluearchive_competitor_v61
      - name: Upload direct competitor corpus
        uses: actions/upload-artifact@v4
        with:
          name: bluearchive-direct-competitor-corpus-v61
          path: artifact_bluearchive_competitor_v61
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
