name: Blue Archive v62 final official assets
on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v62/download_final_assets.py
      - .github/workflows/bluearchive-v62-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: python research/bluearchive_v62/download_final_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: bluearchive-v62-official-assets
          path: artifact_bluearchive_v62_assets
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
