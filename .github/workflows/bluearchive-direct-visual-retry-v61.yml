name: Blue Archive direct visual retry v61
on:
  pull_request:
    branches: [main]
    paths:
      - research/bluearchive_v61/collect_direct_visual_retry.py
      - .github/workflows/bluearchive-direct-visual-retry-v61.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
      - run: python research/bluearchive_v61/collect_direct_visual_retry.py
      - uses: actions/upload-artifact@v4
        with:
          name: bluearchive-direct-visual-retry-v61
          path: artifact_direct_visual_retry_v61
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
